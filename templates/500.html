{% extends 'base.html' %}

{% block title %}Server Error (500) - E-Waste Portal{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-bold text-danger mb-2">500</div>
    <h3 class="fw-bold mb-3">Internal Server Error</h3>
    <p class="text-muted max-w-500 mx-auto mb-4" style="max-width: 480px;">
      An unexpected internal application condition occurred. Please try again or return to the homepage.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary px-4 py-2">
      <i class="fa-solid fa-house me-1"></i> Return to Homepage
    </a>
  </div>
</div>
{% endblock %}
