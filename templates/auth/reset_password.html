{% extends 'base.html' %}

{% block title %}Reset Password - E-Waste Collection Drive{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card card-eco shadow-sm p-4 bg-white">
        <div class="text-center mb-4">
          <div class="p-3 bg-success-subtle text-success rounded-circle d-inline-block mb-2">
            <i class="fa-solid fa-lock-open fs-3"></i>
          </div>
          <h3 class="fw-bold">Create New Password</h3>
          <p class="text-muted small">Please enter and confirm your new secure password.</p>
        </div>

        <form action="{{ url_for('reset_password', token=token) }}" method="POST" class="needs-validation" novalidate>
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold small">New Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
              <input type="password" class="form-control" id="password" name="password" minlength="6" placeholder="At least 6 characters" required autofocus>
              <div class="invalid-feedback">Password must be at least 6 characters.</div>
            </div>
          </div>

          <div class="mb-3">
            <label for="confirm_password" class="form-label fw-semibold small">Confirm New Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fa-solid fa-shield-halved text-muted"></i></span>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" placeholder="Re-type new password" required>
              <div class="invalid-feedback">Please confirm your new password.</div>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 py-2 fw-semibold mb-3">
            <i class="fa-solid fa-check me-2"></i> Update Password
          </button>
        </form>

        <div class="text-center small text-muted">
          <a href="{{ url_for('login') }}" class="text-success fw-bold text-decoration-none">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
